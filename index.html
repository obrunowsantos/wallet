<style>
:root{--bg:hsl(0,0%,97%);--card:hsl(0,0%,100%);--fg:hsl(0,0%,8%);--primary:hsl(346,97%,55%);--muted:hsl(220,14%,92%);--muted-fg:hsl(220,10%,45%);--border:hsl(220,13%,89%);--reward:hsl(142,71%,45%);--gold:hsl(43,96%,56%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .35s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}.d7{animation-delay:.35s}

.card{width:100%;max-width:520px;background:var(--card)}
@media(min-width:560px){.card{border-radius:1.5rem;margin:20px auto;box-shadow:0 25px 50px -12px rgb(0 0 0/.08)}}
.inner{padding:20px}

.top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.nav-btn{width:40px;height:40px;border-radius:.875rem;background:var(--muted);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav-btn:hover{background:hsl(220 14% 85%)}

.bal-card{background:var(--fg);color:#fff;border-radius:1.25rem;padding:20px;margin-bottom:10px;position:relative;overflow:hidden}
.bal-card::after{content:'';position:absolute;top:-16px;right:-16px;width:80px;height:80px;background:hsl(0 0% 100%/.06);border-radius:50%}
.bal-sub{font-size:11px;opacity:.6;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.bal-num{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.bal-confirm{font-size:12px;color:var(--primary);font-weight:600;margin-top:6px}

.sec-title{font-size:17px;font-weight:800;margin-bottom:14px}
.pix-lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-fg);margin-bottom:16px}

.amt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.amt-btn{padding:12px 4px;border-radius:1rem;border:2px solid var(--border);background:hsl(220 14% 92%/.6);font-size:13px;font-weight:800;color:var(--muted-fg);cursor:pointer;text-align:center;transition:all .18s;font-family:'Poppins',sans-serif}
.amt-btn:hover{border-color:hsl(220 10% 45%/.4);color:var(--fg)}
.amt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 20px 25px -5px hsl(346 97% 55%/.25);transform:scale(1.05)}

.pix-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.pix-inputs select,.pix-inputs input{padding:14px 16px;border:2px solid var(--border);border-radius:1rem;font-size:14px;background:hsl(220 14% 92%/.3);color:var(--fg);font-family:'Poppins',sans-serif;outline:none;transition:border-color .18s;-webkit-appearance:none;appearance:none}
.pix-inputs select:focus,.pix-inputs input:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 2px hsl(346 97% 55%/.1)}
.pix-inputs input::placeholder{color:var(--muted-fg)}
.pix-inputs select.error,.pix-inputs input.error{border-color:hsl(0 84% 60%)}
.field-error{font-size:11px;color:hsl(0 84% 60%);font-weight:600;margin-top:-6px;margin-bottom:4px;padding-left:4px;display:none}
.field-error.show{display:block}

.pix-hint{font-size:11px;color:var(--muted-fg);padding-left:4px;margin-bottom:16px}

.saque-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:1rem;padding:17px;font-size:15px;font-weight:800;font-family:'Poppins',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 20px 25px -5px hsl(346 97% 55%/.25);transition:transform .15s;margin-bottom:10px}
.saque-btn:active{transform:scale(.97)}
.min-note{text-align:center;font-size:12px;color:var(--muted-fg);margin-bottom:24px}

/* Invite card */
.invite{background:linear-gradient(135deg,var(--primary),hsl(346 97% 42%));border-radius:1.5rem;padding:24px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.invite::after{content:'';position:absolute;bottom:-24px;right:-24px;width:112px;height:112px;background:hsl(0 0% 100%/.06);border-radius:50%}
.inv-meta{font-size:11px;opacity:.7;margin-bottom:8px}
.inv-title{font-size:16px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.inv-title svg{width:18px;height:18px;flex-shrink:0}
.inv-sub{font-size:13px;opacity:.7;margin-bottom:20px}
.inv-badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.inv-badge{aspect-ratio:1;border-radius:1rem;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;max-width:60px}
.inv-badge.gold{background:var(--gold);color:hsl(0 0% 8%)}
.inv-badge.dim{background:hsl(0 0% 100%/.15);color:hsl(0 0% 100%/.85)}
.inv-btn{width:100%;background:var(--gold);color:hsl(0 0% 8%);border:none;border-radius:1rem;padding:14px;font-size:14px;font-weight:900;font-family:'Poppins',sans-serif;cursor:pointer;margin-bottom:14px;transition:transform .15s}
.inv-btn:active{transform:scale(.97)}
.inv-code{text-align:center;font-size:13px;opacity:.8;display:flex;align-items:center;justify-content:center;gap:8px}
.copy-btn{background:none;border:none;cursor:pointer;opacity:.7;color:#fff;display:flex;align-items:center;transition:transform .15s}
.copy-btn:hover{transform:scale(1.1)}

/* FAQ */
.faq{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.faq-item{background:hsl(220 14% 92%/.3);border-radius:1rem;overflow:hidden}
.faq-q{width:100%;background:none;border:none;padding:14px 16px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;color:var(--fg);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.faq-icon{font-size:16px;transition:transform .2s;flex-shrink:0}
.faq-a{font-size:12px;color:var(--muted-fg);line-height:1.6;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;padding:0 16px}
.faq-item.open .faq-a{max-height:200px;padding:0 16px 14px}
.faq-item.open .faq-icon{transform:rotate(45deg)}

.disc{text-align:center;font-size:11px;color:var(--muted-fg);padding-bottom:24px}
.disc a{color:var(--primary);font-weight:600}
</style>
</head>
