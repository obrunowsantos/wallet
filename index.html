*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .35s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}.d7{animation-delay:.35s}

.card{width:100%;max-width:520px;background:var(--card)}

.inner{padding:20px}

.top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.nav-btn{width:40px;height:40px;border-radius:.875rem;background:var(--muted);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}

.bal-card{background:var(--fg);color:#fff;border-radius:1.25rem;padding:20px;margin-bottom:10px;position:relative;overflow:hidden}

.bal-num{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.bal-confirm{font-size:12px;color:var(--primary);font-weight:600;margin-top:6px}


.sec-title{font-size:17px;font-weight:800;margin-bottom:14px}
.pix-lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-fg);margin-bottom:16px}

.amt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.amt-btn{padding:12px 4px;border-radius:1rem;border:2px solid var(--border);background:hsl(220 14% 92%/.6);font-size:13px;font-weight:800;color:var(--muted-fg);cursor:pointer;text-align:center;transition:all .18s;font-family:'Poppins',sans-serif}
.amt-btn:hover{border-color:hsl(220 10% 45%/.4);color:var(--fg)}
.amt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 20px 25px -5px hsl(346 97% 55%/.25);transform:scale(1.05)}

.pix-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}

.pix-inputs select:focus,.pix-inputs input:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 2px hsl(346 97% 55%/.1)}
.pix-inputs input::placeholder{color:var(--muted-fg)}
.pix-inputs select.error,.pix-inputs input.error{border-color:hsl(0 84% 60%)}
.field-error{font-size:11px;color:hsl(0 84% 60%);font-weight:600;margin-top:-6px;margin-bottom:4px;padding-left:4px;display:none}
.field-error.show{display:block}

.pix-hint{font-size:11px;color:var(--muted-fg);padding-left:4px;margin-bottom:16px}
